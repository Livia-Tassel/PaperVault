name: 功能建议
description: 描述你的科研工作流和希望改进的操作。
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与当前问题
      description: 你正在完成什么任务，目前卡在哪一步？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望如何改进
      description: 描述预期行为，也可以提供现有替代办法。
    validations:
      required: true
